name: 🎮 Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mustafamahmoud8
          SETTING_JSON: |
            {
              "githubUserName": "mustafamahmoud8",
              "type": "NORMAL",
              "backgroundColor": "#00000000",
              "foregroundColor": "#58A6FF"
            }

      - name: Commit & Push
        run: |
          git config user.email "mustafaelzoghby7@gmail.com"
          git config user.name "mustafamahmoud8"
          git add -A .
          git status
          git diff --staged --quiet || git commit -m "🎮 Generate 3D Contribution Calendar"
          git push
